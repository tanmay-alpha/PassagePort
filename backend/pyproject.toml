[project]
name = "passageport"
version = "1.0.0"
description = "PassagePort backend: document ingestion, hybrid retrieval, evidence-backed answers and comparison."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Tanmay Mangal" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "numpy>=1.26",
    "httpx>=0.28",
    "semchunk>=3.2",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "argon2-cffi>=23.1",
    "fastembed>=0.5",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# Upstream's original models (PyTorch). Only needed for the baseline benchmark or by choice.
heavy = ["sentence-transformers>=3.3", "torch>=2.5"]
# Reproduces the upstream retrieval pipeline in the evaluation harness.
baseline = ["lancedb>=0.19", "sentence-transformers>=3.3", "torch>=2.5", "loguru>=0.7.3"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    "reportlab>=4.2",
    "psutil>=6.0",  # evaluation harness: peak memory and hardware description
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["passageport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs real embedding/reranker model downloads (deselected in CI by default)"]
addopts = "-m 'not models'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF", "PL", "ANN"]
# E501: `ruff format` owns wrapping; what remains are long prose/regex literals.
# PLC0415: heavy optional ML/eval dependencies are imported lazily on purpose.
ignore = ["ANN401", "PLR0913", "PLR2004", "S101", "B008", "E501", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately feed curly quotes / full-width text through normalisation.
"tests/**" = ["ANN", "S", "PLR", "RUF001"]
# The prompt strips typographic quotes from model replies.
"passageport/answer/prompt.py" = ["RUF001"]
# Process-wide lazily-loaded model singletons.
"passageport/ml/registry.py" = ["PLW0603"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
